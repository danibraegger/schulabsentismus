<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Änderungsanträge Schulabsentismus Kt. SZ</title>
<style>
  :root {
    --blue: #0052CC;
    --blue-light: #DEEBFF;
    --gray-bg: #F4F5F7;
    --border: #DFE1E6;
    --text: #172B4D;
    --text-light: #5E6C84;
  }
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    background: var(--gray-bg);
    color: var(--text);
    margin: 0;
    padding: 32px;
  }
  h1 {
    font-size: 20px;
    margin-bottom: 4px;
  }
  .subtitle {
    color: var(--text-light);
    font-size: 13px;
    margin-bottom: 20px;
  }
  .subtitle a { color: var(--blue); }
  .info-box {
    background: #fff;
    border: 1px solid var(--border);
    border-left: 4px solid var(--blue);
    border-radius: 4px;
    padding: 14px 18px;
    margin-bottom: 24px;
    font-size: 13px;
    line-height: 1.5;
  }
  .info-box p { margin: 0 0 10px 0; }
  .info-box p:last-child { margin-bottom: 0; }
  .info-box strong { color: var(--text); }
  table {
    width: 100%;
    border-collapse: collapse;
    background: #fff;
    box-shadow: 0 1px 2px rgba(9,30,66,0.15);
    border-radius: 4px;
    overflow: hidden;
  }
  thead th {
    background: var(--blue);
    color: #fff;
    text-align: left;
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.03em;
    padding: 10px 12px;
    position: sticky;
    top: 0;
  }
  tbody td {
    border-top: 1px solid var(--border);
    padding: 10px 12px;
    font-size: 13px;
    vertical-align: top;
  }
  tbody tr:hover { background: var(--blue-light); }
  .key {
    white-space: nowrap;
    font-weight: 600;
  }
  .key a { color: var(--blue); text-decoration: none; }
  .key a:hover { text-decoration: underline; }
  .status {
    display: inline-block;
    padding: 3px 10px;
    border-radius: 3px;
    font-size: 12px;
    font-weight: 600;
    white-space: nowrap;
    background: #DEEBFF;
    color: #0052CC;
  }
  .status-todo { background: #DFE1E6; color: #42526E; }
  .status-inprogress { background: #DEEBFF; color: #0052CC; }
  .status-done { background: #E3FCEF; color: #006644; }
  .estimate { white-space: nowrap; }
  .empty { color: var(--text-light); font-style: italic; }

  #login-screen {
    max-width: 360px;
    margin: 15vh auto 0;
    background: #fff;
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 28px 24px;
    box-shadow: 0 1px 2px rgba(9,30,66,0.15);
  }
  #login-screen h2 {
    margin: 0 0 16px 0;
    font-size: 16px;
  }
  #login-screen input[type="password"] {
    width: 100%;
    padding: 8px 10px;
    border: 1px solid var(--border);
    border-radius: 4px;
    font-size: 14px;
    margin-bottom: 12px;
  }
  #login-screen button {
    background: var(--blue);
    color: #fff;
    border: none;
    border-radius: 4px;
    padding: 9px 16px;
    font-size: 14px;
    cursor: pointer;
    width: 100%;
  }
  #login-error {
    color: #BF2600;
    font-size: 13px;
    margin-top: 10px;
    display: none;
  }
  #content { display: none; }
</style>
</head>
<body>

<div id="login-screen">
  <h2>Passwortgeschützter Bereich</h2>
  <form id="login-form">
    <input type="password" id="password-input" placeholder="Passwort" autocomplete="current-password" autofocus>
    <button type="submit">Anzeigen</button>
    <div id="login-error">Falsches Passwort.</div>
  </form>
</div>

<div id="content"></div>

  const form = document.getElementById('login-form');
  const passwordInput = document.getElementById('password-input');
  const loginError = document.getElementById('login-error');
  const loginScreen = document.getElementById('login-screen');
  const content = document.getElementById('content');

  function b64ToBytes(b64) {
    return Uint8Array.from(atob(b64), c => c.charCodeAt(0));
  }

  async function tryDecrypt(password) {
    const salt = b64ToBytes(ENC.salt);
    const iv = b64ToBytes(ENC.iv);
    const ciphertext = b64ToBytes(ENC.ciphertext);
    const enc = new TextEncoder();

    const baseKey = await crypto.subtle.importKey('raw', enc.encode(password), 'PBKDF2', false, ['deriveKey']);
    const key = await crypto.subtle.deriveKey(
      { name: 'PBKDF2', salt, iterations: ENC.iterations, hash: 'SHA-256' },
      baseKey,
      { name: 'AES-GCM', length: 256 },
      false,
      ['decrypt']
    );

    const plaintextBuffer = await crypto.subtle.decrypt({ name: 'AES-GCM', iv }, key, ciphertext);
    return new TextDecoder().decode(plaintextBuffer);
  }

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    loginError.style.display = 'none';
    try {
      const html = await tryDecrypt(passwordInput.value);
      content.innerHTML = html;
      loginScreen.style.display = 'none';
      content.style.display = 'block';
    } catch (err) {
      loginError.style.display = 'block';
      passwordInput.value = '';
      passwordInput.focus();
    }
  });
